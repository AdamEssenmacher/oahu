name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Oahu.slnx

      - name: Build
        run: dotnet build Oahu.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Oahu.slnx -c Release --no-build

  format-and-pack:
    name: Format and pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Oahu.slnx

      - name: Verify formatting
        run: dotnet format Oahu.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Oahu.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack Oahu.slnx -c Release --no-build -o artifacts/packages

      - name: Verify packages
        run: |
          shopt -s nullglob
          found=0
          missing=0
          for pkg in artifacts/packages/*.nupkg; do
            found=1
            if [ ! -f "${pkg%.nupkg}.snupkg" ]; then
              echo "::error::No symbol package for ${pkg##*/}"
              missing=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No .nupkg in artifacts/packages"
            exit 1
          fi
          exit "$missing"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 7
